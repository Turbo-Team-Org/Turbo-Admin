name: turbo_admin
description: The admin panel for Turbo.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0" # Adjusted to a more typical range, Flutter 3.29.0 is not a valid Dart SDK range. Let's assume current stable Flutter.

dependencies:
  flutter:
    sdk: flutter

  # PAQUETE PRINCIPAL - contiene toda la lógica

  core:
    path: ../Turbo_Core/core
    # git:
      # url: git@github.com:Turbo-Team-Org/Turbo_Core.git
      # ref:  2737f6401aeee7538cd089888f9cc9a2cfdcd8ce
      # path: core

  # Solo para UI y estado
  flutter_bloc: ^8.1.6
  freezed_annotation: ^3.0.0
  go_router: ^14.6.1
  auto_route: ^9.2.2 # As per issue, though GoRouter is also listed. Sticking to this for now.
  responsive_framework: ^1.5.1
  flutter_hooks: ^0.20.5

  # UI específico
  fl_chart: ^0.69.2
  data_table_2: ^2.5.15
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  flutter_svg: ^2.0.9
  uuid: ^4.5.1
  # GetIt for dependency injection
  get_it: ^8.0.3
  intl: ^0.20.2
  firebase_core: ^3.13.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6
  firebase_analytics: ^11.3.6
  dartz: ^0.10.1
  google_maps_flutter: ^2.5.0
  google_maps_flutter_web: ^0.5.4+2
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.7
  auto_route_generator: ^9.0.0 # Corresponding to auto_route
  freezed: ^3.0.3
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/images/google_logo.png
    - assets/images/google.jpeg
    - assets/images/app_icon.png
    - assets/images/map_placeholder.jpg
    - assets/images/Turbo Marca 1.svg
    - assets/images/Turbo Marca 4.svg
    - assets/images/Turbo Marca 5.svg
    - assets/images/Turbo Marca 6.svg
    - assets/images/Turbo Marca 7.svg
    - assets/images/Turbo Marca 8.svg
    - assets/images/Turbo Marca 9.svg
    - assets/images/Turbo Foto de Perfil 1.svg
    - assets/images/Turbo Foto de Perfil 2.svg

  # Fuentes personalizadas
  fonts:
    - family: MuseoSans
      fonts:
        - asset: assets/fonts/exljbris - MuseoSans-300.otf
          weight: 300
        - asset: assets/fonts/exljbris - MuseoSans-500.otf
          weight: 500
        - asset: assets/fonts/exljbris - MuseoSans-700.otf
          weight: 700
        - asset: assets/fonts/exljbris - MuseoSans-900.otf
          weight: 900
