name: turbo_admin
description: The admin panel for Turbo.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0' # Adjusted to a more typical range, Flutter 3.29.0 is not a valid Dart SDK range. Let's assume current stable Flutter.

dependencies:
  flutter:
    sdk: flutter

  # PAQUETE PRINCIPAL - contiene toda la lógica
  core:
    path: ../turbo_core # Assuming turbo_core is in a parallel directory

  # Solo para UI y estado
  flutter_bloc: ^8.1.6
  go_router: ^14.6.1
  auto_route: ^9.2.2 # As per issue, though GoRouter is also listed. Sticking to this for now.
  responsive_framework: ^1.5.1
  flutter_hooks: ^0.20.5

  # UI específico
  fl_chart: ^0.69.2
  data_table_2: ^2.5.15
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  
  # GetIt for dependency injection
  get_it: ^7.7.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  
  build_runner: ^2.4.7
  auto_route_generator: ^9.0.0 # Corresponding to auto_route

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
