name: turbo_admin
description: The admin panel for Turbo.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0" # Adjusted to a more typical range, Flutter 3.29.0 is not a valid Dart SDK range. Let's assume current stable Flutter.

dependencies:
  flutter:
    sdk: flutter

  # Paquete Core: mismo ref que Turbo_App (tip feat/supabase-migration, merge con develop).
  core:
    git:
      url: https://github.com/Turbo-Team-Org/Turbo_Core.git
      ref: a870ec9
      path: core

  # Solo para UI y estado
  flutter_bloc: ^8.1.6
  go_router: ^14.6.1
  auto_route: ^9.2.2 # As per issue, though GoRouter is also listed. Sticking to this for now.
  responsive_framework: ^1.5.1
  flutter_hooks: ^0.20.5

  # UI específico
  fl_chart: ^0.69.2
  data_table_2: ^2.5.15
  file_picker: ^8.1.2
  image_picker: ^1.1.2

  # GetIt for dependency injection
  get_it: ^8.0.3
  # Misma línea que Turbo_Core/core: variables leídas por Env en init_config.
  flutter_dotenv: ^5.2.1
  intl: ^0.20.2
  firebase_core: ^3.13.1
  flutter_svg: ^2.2.0
  google_maps_flutter: ^2.12.3

  # Estados inmutables con copyWith generado (sealed classes).
  # Versión alineada con Turbo_Core/core/pubspec.yaml.
  freezed_annotation: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.7
  auto_route_generator: ^9.0.0 # Corresponding to auto_route
  freezed: ^3.0.3

  flutter_lints: ^4.0.0

  # Testing: mocking + bloc test helpers (compatibles con flutter_bloc 8.x)
  mocktail: ^1.0.4
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # Copia local (no versionar secretos): ver .env.example en la raíz del Admin.
    - .env
